<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favWire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#favBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="124" stroke="rgba(255,255,255,0.35)" stroke-width="16"/>

  <!-- Orbital Ring (O Concept) -->
  <circle cx="256" cy="256" r="160" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.95"/>

  <!-- Digital Signal Wave (W Concept) -->
